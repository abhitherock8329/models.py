<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-primary mb-4">{{ course.name }}</h1>
        
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h3 class="mb-0">Course Lessons</h3>
            </div>
            <div class="card-body">
                <ul class="list-group list-group-flush">
                    {% for lesson in course.lesson_set.all %}
                        <li class="list-group-item">
                            <strong>Lesson {{ forloop.counter }}:</strong> {{ lesson.title }}
                        </li>
                    {% empty %}
                        <li class="list-group-item text-muted">No lessons available for this course yet.</li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
